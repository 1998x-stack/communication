name: Publish Yanxi to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build and validate
        run: |
          npm run build
          npm test
          git diff --exit-code
      - name: Assemble standalone website
        run: |
          mkdir -p dist/assets dist/data/cases
          cp index.html .nojekyll dist/
          cp assets/* dist/assets/
          cp data/catalog.json dist/data/
          cp data/cases/*.json dist/data/cases/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
