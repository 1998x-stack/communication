name: Refresh curated case JSON (temporary)
on:
  push:
    branches: [content/curate-remaining-243]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and validate all cases
        run: |
          npm run build
          npm test
      - name: Commit generated case snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cases/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(content): regenerate 270 curated case snapshots"
            git push origin HEAD:content/curate-remaining-243
          fi
