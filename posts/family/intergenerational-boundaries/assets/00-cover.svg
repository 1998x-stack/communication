<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title-intergenerational-boundaries-cover-false desc-intergenerational-boundaries-cover-false"><title id="title-intergenerational-boundaries-cover-false">与父母沟通：尊重关切，也保留自主边界</title><desc id="desc-intergenerational-boundaries-cover-false">把关心与控制分开，把不可协商的决定和可协商的安排说清楚</desc><defs><marker id="arrow-intergenerational-boundaries-cover" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718984" stroke-width="1.4"/></marker></defs><rect width="960" height="330" rx="24" fill="#f5faf7"/><path d="M313 210 h 33" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-intergenerational-boundaries-cover)"/><path d="M613 210 h 33" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-intergenerational-boundaries-cover)"/><rect x="55" y="150" width="250" height="120" rx="18" fill="#dff1eb" stroke="#2c8b78" stroke-width="2"/><circle cx="83" cy="178" r="14" fill="#2c8b78"/><text x="83" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">1</text><text x="180" y="216" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="180" dy="0">尊重关切</tspan></text><rect x="355" y="150" width="250" height="120" rx="18" fill="#ffeadb" stroke="#cf744a" stroke-width="2"/><circle cx="383" cy="178" r="14" fill="#cf744a"/><text x="383" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">2</text><text x="480" y="216" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="480" dy="0">保持边界</tspan></text><rect x="655" y="150" width="250" height="120" rx="18" fill="#eee9fa" stroke="#7766ad" stroke-width="2"/><circle cx="683" cy="178" r="14" fill="#7766ad"/><text x="683" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">3</text><text x="780" y="216" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="780" dy="0">协商安排</tspan></text></svg>
