<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="title-partner-dialogue-map-true desc-partner-dialogue-map-true"><title id="title-partner-dialogue-map-true">亲密关系沟通：先理解感受，再表达需求</title><desc id="desc-partner-dialogue-map-true">事实、关切、请求与行动的边界</desc><defs><marker id="arrow-partner-dialogue-map" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718984" stroke-width="1.4"/></marker></defs><rect width="480" height="800" rx="24" fill="#f5faf7"/><path d="M240 181 v 38" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-partner-dialogue-map)"/><path d="M240 346 v 38" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-partner-dialogue-map)"/><path d="M240 511 v 38" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-partner-dialogue-map)"/><rect x="40" y="70" width="400" height="108" rx="18" fill="#dff1eb" stroke="#2c8b78" stroke-width="2"/><circle cx="68" cy="98" r="14" fill="#2c8b78"/><text x="68" y="103" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">1</text><text x="240" y="136" text-anchor="middle" font-size="25" font-weight="750" fill="#203035"><tspan x="240" dy="0">理解：复述感受，不急着辩解</tspan></text><rect x="40" y="235" width="400" height="108" rx="18" fill="#ffeadb" stroke="#cf744a" stroke-width="2"/><circle cx="68" cy="263" r="14" fill="#cf744a"/><text x="68" y="268" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">2</text><text x="240" y="301" text-anchor="middle" font-size="25" font-weight="750" fill="#203035"><tspan x="240" dy="0">事实：说具体行为，不贴标签</tspan></text><rect x="40" y="400" width="400" height="108" rx="18" fill="#eee9fa" stroke="#7766ad" stroke-width="2"/><circle cx="68" cy="428" r="14" fill="#7766ad"/><text x="68" y="433" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">3</text><text x="240" y="466" text-anchor="middle" font-size="25" font-weight="750" fill="#203035"><tspan x="240" dy="0">需要：讲清希望改变什么</tspan></text><rect x="40" y="565" width="400" height="108" rx="18" fill="#fff2cf" stroke="#a7802f" stroke-width="2"/><circle cx="68" cy="593" r="14" fill="#a7802f"/><text x="68" y="598" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">4</text><text x="240" y="631" text-anchor="middle" font-size="25" font-weight="750" fill="#203035"><tspan x="240" dy="0">修复：约定小行动与返回时间</tspan></text></svg>
