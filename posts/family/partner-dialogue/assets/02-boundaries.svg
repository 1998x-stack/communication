<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title-partner-dialogue-map-false desc-partner-dialogue-map-false"><title id="title-partner-dialogue-map-false">亲密关系沟通：先理解感受，再表达需求</title><desc id="desc-partner-dialogue-map-false">事实、关切、请求与行动的边界</desc><defs><marker id="arrow-partner-dialogue-map" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718984" stroke-width="1.4"/></marker></defs><rect width="960" height="390" rx="24" fill="#f5faf7"/><path d="M248 210 h 13" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-partner-dialogue-map)"/><path d="M483 210 h 13" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-partner-dialogue-map)"/><path d="M718 210 h 13" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-partner-dialogue-map)"/><rect x="35" y="150" width="205" height="120" rx="18" fill="#dff1eb" stroke="#2c8b78" stroke-width="2"/><circle cx="63" cy="178" r="14" fill="#2c8b78"/><text x="63" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">1</text><text x="137.5" y="204" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="137.5" dy="0">理解：复述感受</tspan><tspan x="137.5" dy="30">，不急着辩解</tspan></text><rect x="270" y="150" width="205" height="120" rx="18" fill="#ffeadb" stroke="#cf744a" stroke-width="2"/><circle cx="298" cy="178" r="14" fill="#cf744a"/><text x="298" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">2</text><text x="372.5" y="204" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="372.5" dy="0">事实：说具体行</tspan><tspan x="372.5" dy="30">为，不贴标签</tspan></text><rect x="505" y="150" width="205" height="120" rx="18" fill="#eee9fa" stroke="#7766ad" stroke-width="2"/><circle cx="533" cy="178" r="14" fill="#7766ad"/><text x="533" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">3</text><text x="607.5" y="204" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="607.5" dy="0">需要：讲清希望</tspan><tspan x="607.5" dy="30">改变什么</tspan></text><rect x="740" y="150" width="205" height="120" rx="18" fill="#fff2cf" stroke="#a7802f" stroke-width="2"/><circle cx="768" cy="178" r="14" fill="#a7802f"/><text x="768" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">4</text><text x="842.5" y="204" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="842.5" dy="0">修复：约定小行</tspan><tspan x="842.5" dy="30">动与返回时间</tspan></text></svg>
