<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title-communication-loop-cover-false desc-communication-loop-cover-false"><title id="title-communication-loop-cover-false">沟通闭环：从听懂到行动</title><desc id="desc-communication-loop-cover-false">沟通不是把话说完，而是让事实、理解、请求与下一步形成闭环</desc><defs><marker id="arrow-communication-loop-cover" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718984" stroke-width="1.4"/></marker></defs><rect width="960" height="330" rx="24" fill="#f5faf7"/><path d="M313 210 h 33" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-communication-loop-cover)"/><path d="M613 210 h 33" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-communication-loop-cover)"/><rect x="55" y="150" width="250" height="120" rx="18" fill="#dff1eb" stroke="#2c8b78" stroke-width="2"/><circle cx="83" cy="178" r="14" fill="#2c8b78"/><text x="83" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">1</text><text x="180" y="216" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="180" dy="0">先听清问题</tspan></text><rect x="355" y="150" width="250" height="120" rx="18" fill="#ffeadb" stroke="#cf744a" stroke-width="2"/><circle cx="383" cy="178" r="14" fill="#cf744a"/><text x="383" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">2</text><text x="480" y="216" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="480" dy="0">说准事实与需要</tspan></text><rect x="655" y="150" width="250" height="120" rx="18" fill="#eee9fa" stroke="#7766ad" stroke-width="2"/><circle cx="683" cy="178" r="14" fill="#7766ad"/><text x="683" y="183" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">3</text><text x="780" y="216" text-anchor="middle" font-size="23" font-weight="750" fill="#203035"><tspan x="780" dy="0">确认行动与边界</tspan></text></svg>
