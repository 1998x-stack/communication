<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 650" role="img" aria-labelledby="title-collaboration-loop-cover-true desc-collaboration-loop-cover-true"><title id="title-collaboration-loop-cover-true">同事协作：把口头配合变成执行闭环</title><desc id="desc-collaboration-loop-cover-true">共同目标、清晰责任与复述确认，减少“我以为你会做”的落差</desc><defs><marker id="arrow-collaboration-loop-cover" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718984" stroke-width="1.4"/></marker></defs><rect width="480" height="650" rx="24" fill="#f5faf7"/><path d="M240 181 v 38" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-collaboration-loop-cover)"/><path d="M240 346 v 38" fill="none" stroke="#718984" stroke-width="3" marker-end="url(#arrow-collaboration-loop-cover)"/><rect x="40" y="70" width="400" height="108" rx="18" fill="#dff1eb" stroke="#2c8b78" stroke-width="2"/><circle cx="68" cy="98" r="14" fill="#2c8b78"/><text x="68" y="103" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">1</text><text x="240" y="136" text-anchor="middle" font-size="25" font-weight="750" fill="#203035"><tspan x="240" dy="0">目标一致</tspan></text><rect x="40" y="235" width="400" height="108" rx="18" fill="#ffeadb" stroke="#cf744a" stroke-width="2"/><circle cx="68" cy="263" r="14" fill="#cf744a"/><text x="68" y="268" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">2</text><text x="240" y="301" text-anchor="middle" font-size="25" font-weight="750" fill="#203035"><tspan x="240" dy="0">责任清晰</tspan></text><rect x="40" y="400" width="400" height="108" rx="18" fill="#eee9fa" stroke="#7766ad" stroke-width="2"/><circle cx="68" cy="428" r="14" fill="#7766ad"/><text x="68" y="433" font-size="15" text-anchor="middle" fill="#fff" font-weight="800">3</text><text x="240" y="466" text-anchor="middle" font-size="25" font-weight="750" fill="#203035"><tspan x="240" dy="0">执行闭环</tspan></text></svg>
